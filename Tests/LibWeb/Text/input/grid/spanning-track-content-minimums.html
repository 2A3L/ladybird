<!DOCTYPE html>
<script src="../include.js"></script>
<style>
    #grid {
        display: grid;
        width: 100px;
        column-gap: 5px;
        grid-template-columns: 10px minmax(var(--minimum), 0px) 12px;
    }

    #subgrid {
        display: grid;
        grid-column: span 2;
        grid-template-columns: subgrid;
    }

    #item { grid-column: span 2; min-width: 0; font-size: 0; }
    #item span { display: inline-block; height: 6px; vertical-align: top; }
</style>
<div id="grid">
    <div id="subgrid">
        <div id="item"><span style="width: 30px"></span><wbr><span style="width: 50px"></span></div>
    </div>
    <div id="marker"></div>
</div>
<script>
    test(() => {
        const grid = document.getElementById("grid");
        const marker = document.getElementById("marker");
        for (const minimum of ["auto", "min-content", "max-content", "auto"]) {
            grid.style.setProperty("--minimum", minimum);
            const rect = grid.getBoundingClientRect();
            println(`${minimum}: last column at ${marker.getBoundingClientRect().left - rect.left}, grid height ${rect.height}`);
        }
    });
</script>
